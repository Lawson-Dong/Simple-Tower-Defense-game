<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .game-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }
        
        .game-board {
            flex: 1;
            background-color: #fff;
            border: 2px solid #333;
            position: relative;
            overflow: hidden;
            width: 800px;
            height: 600px;
        }
        
        .game-info {
            width: 200px;
            background-color: #fff;
            border: 2px solid #333;
            padding: 15px;
            border-radius: 5px;
        }
        
        .wave-info, .tower-info {
            margin-bottom: 20px;
        }
        
        .tower-selection {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .tower-btn {
            width: 60px;
            height: 60px;
            border: 2px solid #333;
            border-radius: 5px;
            background-color: #e0e0e0;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .tower-btn:hover {
            background-color: #d0d0d0;
        }
        
        .tower-btn.selected {
            border-color: #00ff00;
            background-color: #c0e0c0;
        }
        
        .tower {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #ff6347;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .enemy {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #800080;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .projectile {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #ff0;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff0, 0 0 20px #ff0;
            animation: projectileMove 0.5s linear infinite;
        }
        
        @keyframes projectileMove {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.7; transform: scale(1.2); }
        }
        
        .tower {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #ff6347;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 99, 71, 0.7);
            transition: all 0.3s ease;
        }
        
        .tower:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 99, 71, 1);
        }
        
        .tower.firing {
            animation: towerFiring 0.5s ease-out;
        }
        
        .tower.selected {
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.8) !important;
            border: 2px solid yellow;
        }
        
        @keyframes towerFiring {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 99, 71, 0.7); }
            50% { transform: scale(1.1); box-shadow: 0 0 25px rgba(255, 215, 0, 1); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 99, 71, 0.7); }
        }
        
        .track {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #666;
            border: 2px solid #333;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            z-index: 8;
            transition: all 0.2s ease;
            font-size: 16px;
        }
        
        .track:hover {
            background-color: #888;
            transform: scale(1.05);
        }
        
        .range-indicator {
            position: absolute;
            border-radius: 50%;
            border: 2px dashed;
            pointer-events: none;
            z-index: 7;
            transition: all 0.2s ease;
        }
        
        .energy-display {
            position: absolute;
            bottom: 2px;
            left: 2px;
            right: 2px;
            height: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 2px;
            font-size: 8px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        .enemy {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #800080;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(128, 0, 128, 0.7);
            transition: all 0.2s ease;
        }
        
        .enemy.hit {
            animation: enemyHit 0.3s ease-out;
        }
        
        @keyframes enemyHit {
            0% { transform: scale(1); background-color: #800080; }
            50% { transform: scale(1.2); background-color: #ff4500; }
            100% { transform: scale(1); background-color: #800080; }
        }
        
        .enemy.slowed {
            background-color: #9370db !important;
            box-shadow: 0 0 15px rgba(147, 112, 219, 0.7);
            animation: enemySlow 0.5s ease-out;
        }
        
        @keyframes enemySlow {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .enemy.death {
            animation: enemyDeath 0.5s ease-out forwards;
        }
        
        @keyframes enemyDeath {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        .explosion {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #ff4500;
            border-radius: 50%;
            animation: explosion 0.5s ease-out forwards;
            z-index: 10;
        }
        
        @keyframes explosion {
            0% { transform: scale(0); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.7; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        .path {
            position: absolute;
            background-color: #888;
            z-index: 0;
        }
        
        .start-point, .end-point {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .start-point {
            background-color: #008000;
        }
        
        .end-point {
            background-color: #ff0000;
        }
        
        .game-over, .game-win {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            font-size: 24px;
            z-index: 100;
        }
        
        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .btn:hover {
            background-color: #45a049;
        }
        
        .level-selection {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .level-btn {
            margin: 0 10px;
        }
        
        .tower.heal {
            animation: towerHeal 0.2s ease-in-out;
        }
        
        .tower.converted {
            animation: towerConverted 1s ease-in-out;
        }
        
        @keyframes towerHeal {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); filter: brightness(1.5) hue-rotate(90deg); }
            100% { transform: scale(1); }
        }
        
        @keyframes towerConverted {
            0% { transform: scale(1); filter: hue-rotate(0deg); }
            50% { transform: scale(1.3); filter: hue-rotate(180deg); }
            100% { transform: scale(1); filter: hue-rotate(180deg); }
        }
    </style>
</head>
<body>
    <h1>Tower Defense Game</h1>
    <div class="level-selection">
            <h3>选择关卡</h3>
            <button class="btn level-btn" data-level="0">关卡 1</button>
            <button class="btn level-btn" data-level="1">关卡 2</button>
            <button class="btn level-btn" data-level="2">关卡 3</button>
            <button class="btn level-btn" data-level="3">关卡 4</button>
        </div>
    <div class="game-container">
        <div class="game-board" id="gameBoard">
            <div class="start-point" style="top: 100px; left: 50px;">Start</div>
            <div class="end-point" style="top: 500px; left: 750px;">End</div>
        </div>
        <div class="game-info">
            <div class="wave-info">
                <h3>Wave: <span id="waveCount">1</span></h3>
                <h3>Remaining Enemies: <span id="enemyCount">0</span></h3>
                <div class="loading-message" id="loadingMessage"></div>
                <h3>Health: <span id="health">10</span></h3>
                <h3>Gold: <span id="gold">100</span></h3>
            </div>
            <div class="tower-info">
                <h3>Towers</h3>
                <div class="tower-selection">
                    <div class="tower-btn" data-type="machinegun" data-cost="80" draggable="true">
                        <span>Machine Gun</span>
                        <span>80G</span>
                    </div>
                    <div class="tower-btn" data-type="cannon" data-cost="150" draggable="true">
                        <span>Cannon</span>
                        <span>150G</span>
                    </div>
                    <div class="tower-btn" data-type="slowgun" data-cost="100" draggable="true">
                        <span>Slow Gun</span>
                        <span>100G</span>
                    </div>
                    <div class="tower-btn" data-type="walkercannon" data-cost="200" draggable="true">
                        <span>Walker Cannon</span>
                        <span>200G</span>
                    </div>
                    <div class="tower-btn" data-type="therapy" data-cost="120" draggable="true">
                        <span>Therapy Tower</span>
                        <span>120G</span>
                    </div>
                </div>
            </div>
            <div class="game-controls">
                <button class="btn" id="startButton">Start</button>
            </div>

        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
